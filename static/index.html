<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automated Posting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">AP</span>
        <div>
          <p class="brand-name">Automated Posting</p>
          <p class="brand-sub">multi-platform publisher</p>
        </div>
      </div>
      <a class="docs-link" href="/docs" target="_blank" rel="noopener">API Docs</a>
    </header>

    <main class="shell">
      <section class="panel compose">
        <h1>Create post</h1>
        <p class="lede">Enter message with one URL, select platforms, publish.</p>

        <form id="post-form" novalidate>
          <label class="field">
            <span class="label-row">
              <span>Message</span>
              <span id="char-count">0 / 200</span>
            </span>
            <textarea
              id="message"
              name="message"
              maxlength="200"
              rows="5"
              placeholder="Discover our new platform today! https://example.com"
              required
            ></textarea>
            <span class="hint">max 200 chars, exactly one http/https URL</span>
          </label>

          <fieldset class="platforms">
            <legend>Platforms</legend>
            <div class="platform-actions">
              <button type="button" id="select-all" class="text-btn">Select all</button>
              <button type="button" id="clear-all" class="text-btn">Clear</button>
            </div>
            <div class="platform-grid" id="platform-grid">
              <label class="platform-chip">
                <input type="checkbox" name="platforms" value="telegram" checked />
                <span>Telegram</span>
              </label>
              <label class="platform-chip">
                <input type="checkbox" name="platforms" value="discord" checked />
                <span>Discord</span>
              </label>
              <label class="platform-chip">
                <input type="checkbox" name="platforms" value="bluesky" checked />
                <span>Bluesky</span>
              </label>
              <label class="platform-chip">
                <input type="checkbox" name="platforms" value="mastodon" checked />
                <span>Mastodon</span>
              </label>
              <label class="platform-chip">
                <input type="checkbox" name="platforms" value="slack" checked />
                <span>Slack</span>
              </label>
            </div>
          </fieldset>

          <button type="submit" id="submit-btn" class="primary-btn">Publish</button>
        </form>
      </section>

      <section class="panel results" aria-live="polite">
        <div class="results-head">
          <h2>Results</h2>
          <p id="results-summary" class="results-summary">No publish yet.</p>
        </div>
        <div id="results-list" class="results-list">
          <div class="empty-state">Results will show here after publish.</div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" hidden role="status"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
